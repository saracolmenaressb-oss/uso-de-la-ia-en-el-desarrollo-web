<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mostrar JSON Completo</title>

  <style>

    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background: #0f172a;
      color: white;
      padding: 30px;
    }

    h1{
      text-align: center;
      margin-bottom: 40px;
    }

    h2{
      margin: 40px 0 20px;
      color: #38bdf8;
    }

    /* ======================
        TABLA
    ====================== */

    table{
      width: 100%;
      border-collapse: collapse;
      background: #1e293b;
      border-radius: 10px;
      overflow: hidden;
    }

    th, td{
      padding: 12px;
      border-bottom: 1px solid #334155;
      text-align: left;
    }

    th{
      background: #2563eb;
    }

    tr:hover{
      background: #334155;
    }

    /* ======================
        LISTA
    ====================== */

    .lista{
      list-style: none;
    }

    .lista li{
      background: #1e293b;
      margin-bottom: 10px;
      padding: 15px;
      border-radius: 10px;
      transition: 0.3s;
    }

    .lista li:hover{
      transform: translateX(5px);
      background: #334155;
    }

    /* ======================
        CARDS
    ====================== */

    .cards{
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .card{
      background: #1e293b;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: 0.3s;
    }

    .card:hover{
      transform: translateY(-5px);
    }

    .card h3{
      color: #38bdf8;
      margin-bottom: 10px;
    }

    .card p{
      margin-bottom: 8px;
    }

  </style>
</head>
<body>

  <h1>Mostrar JSON en Tabla, Lista y Tarjetas</h1>
